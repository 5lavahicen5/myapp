async function startRecording(mode, cameraFacing) {
    recordedChunks = [];
    try {
        var stream;
        if (mode === 'audio') {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } else {
            var constraints = {
                video: { 
                    width: { ideal: 480 }, 
                    height: { ideal: 480 },
                    facingMode: cameraFacing || 'user'
                },
                audio: true
            };
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            var preview = document.getElementById('previewVideo');
            if (preview) {
                preview.srcObject = stream;
                document.getElementById('videoPreviewCircle').style.display = 'block';
                document.getElementById('videoPreviewCircle').style.width = '120px';
                document.getElementById('videoPreviewCircle').style.height = '120px';
            }
        }
        recordingStream = stream;
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
        mediaRecorder.ondataavailable = function(e) { if (e.data.size) recordedChunks.push(e.data); };
        mediaRecorder.onstop = function() {
            var blob = new Blob(recordedChunks, { type: mode === 'audio' ? 'audio/webm' : 'video/webm' });
            var reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = function() {
                sendMessage('', reader.result, mode);
                if (recordingStream) recordingStream.getTracks().forEach(function(t) { t.stop(); });
                document.getElementById('videoPreviewCircle').style.display = 'none';
            };
            recordBtn.classList.remove('recording-active');
            isRecording = false;
            toast(mode==='audio'?'🎙 Голосовое отправлено':'📹 Видео отправлено');
        };
        mediaRecorder.start();
        recordBtn.classList.add('recording-active');
        isRecording = true;
        var timeout = mode === 'audio' ? 30000 : 15000;
        setTimeout(function() {
            if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
        }, timeout);
    } catch(e) {
        toast('Ошибка доступа: ' + e.message);
        recordBtn.classList.remove('recording-active');
        isRecording = false;
    }
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    if (recordingStream) {
        recordingStream.getTracks().forEach(function(t) { t.stop(); });
        recordingStream = null;
    }
    document.getElementById('videoPreviewCircle').style.display = 'none';
    recordBtn.classList.remove('recording-active');
    isRecording = false;
}

async function getCallMedia(withVideo) {
    if (withVideo === undefined) withVideo = true;
    try {
        var constraints = { audio: true };
        if (withVideo) constraints.video = { 
            width: { ideal: 640 }, 
            height: { ideal: 480 }, 
            facingMode: 'user',
            frameRate: { ideal: 30, max: 30 }
        };
        var stream = await navigator.mediaDevices.getUserMedia(constraints);
        localVideoTrack = stream.getVideoTracks()[0];
        isVideoEnabled = !!localVideoTrack;
        return stream;
    } catch(e) {
        try {
            var stream2 = await navigator.mediaDevices.getUserMedia({ audio: true });
            localVideoTrack = null;
            isVideoEnabled = false;
            toast('Видео недоступно, только аудио');
            return stream2;
        } catch(e2) {
            throw new Error('Нет доступа к микрофону');
        }
    }
}

        peerConnection = new RTCPeerConnection({

                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },

async function endCall(sendMsg) {
    if (sendMsg === undefined) sendMsg = true;
    stopRingtone();
    stopDialTone();
    releaseWakeLock();
    callInProgress = false;
    if (peerConnection) { peerConnection.close(); peerConnection = null; }
    if (localStream) { localStream.getTracks().forEach(function(t) { t.stop(); }); localStream = null; }
    if (remoteAudio) { remoteAudio.pause(); remoteAudio = null; }
    document.getElementById('remoteVideoContainer').style.display = 'none';
    document.getElementById('remoteVideo').srcObject = null;
    document.getElementById('localVideoPreview').style.display = 'none';
    document.getElementById('localPreviewVideo').srcObject = null;
    localVideoTrack = null;
    isVideoEnabled = false;
    if (currentCallRef && sendMsg && currentChatId && callStartTime && currentChatId !== SAVED_CHAT_ID && currentChatId !== AI_ID) {
        var dur = Math.round((Date.now() - callStartTime) / 1000);
        if (dur > 0) {
            await db.ref('messages/' + currentChatId).push({
                text: t('callDuration') + ' ' + dur + ' сек',
                senderId: 'system',
                senderName: 'System',
                time: Date.now(),
                isSystem: true
            });
        }
    }
    if (currentCallRef) { currentCallRef.child('hangup').set(true); currentCallRef = null; }
    hideCallUI();
}

function showCallUI(state, fromUid) {
    if (!fromUid) fromUid = null;
    var accept = document.getElementById('callAcceptBtn');
    var reject = document.getElementById('callRejectBtn');
    var hangup = document.getElementById('callHangupBtn');
    var muteBtn = document.getElementById('callMuteMicBtn');
    var videoBtn = document.getElementById('callToggleVideoBtn');
    var nameSpan = document.getElementById('callName');
    var statusSpan = document.getElementById('callStatus');
    document.getElementById('remoteVideoContainer').style.display = 'none';
    if (state === 'incoming' && fromUid) {
        var user = Object.values(allUsers).find(function(u) { return u.uid === fromUid; });
        nameSpan.innerText = user ? user.username : 'Собеседник';
        statusSpan.innerText = 'Входящий звонок...';
        accept.style.display = 'flex';
        reject.style.display = 'flex';
        hangup.style.display = 'none';
        muteBtn.style.display = 'none';
        videoBtn.style.display = 'none';
    } else if (state === 'calling') {
        nameSpan.innerText = document.getElementById('chatName').innerText;
        statusSpan.innerText = 'Звонок...';
        accept.style.display = 'none';
        reject.style.display = 'flex';
        hangup.style.display = 'none';
        muteBtn.style.display = 'none';
        videoBtn.style.display = 'none';
        reject.onclick = function() { endCall(true); };
    } else if (state === 'active') {
        statusSpan.innerText = 'Разговор...';
        accept.style.display = 'none';
        reject.style.display = 'none';
        hangup.style.display = 'flex';
        muteBtn.style.display = 'flex';
        videoBtn.style.display = (callVideoEnabled && localStream && localStream.getVideoTracks().length) ? 'flex' : 'none';
        hangup.onclick = function() { endCall(true); };
        muteBtn.onclick = function() {
            isMicMuted = !isMicMuted;

            muteBtn.innerHTML = isMicMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
            muteBtn.style.background = isMicMuted ? '#e74c3c' : '#2c3e50';
        };

async function renderMessages(msgs) {
    var container = document.getElementById('messagesArea');
    if (!container) return;
    
    if (!msgs.length) {
        container.innerHTML = '<div style="text-align:center;margin-top:40px;color:var(--text-secondary);">💬 Напишите сообщение</div>';
        return;
    }
    var html = '';
    for (var i = 0; i < msgs.length; i++) {
        var msg = msgs[i];
        if (msg.isSystem) {
            html += '<div class="system-message">' + escapeHtml(msg.text) + '</div>';
            continue;
        }
        var isOut = msg.senderId === currentUser?.uid;
        var statusHtml = '', readCountHtml = '';
        if (isOut && msg.status && currentChatId !== SAVED_CHAT_ID && currentChatId !== AI_ID) {
            if (msg.status === 'sent') statusHtml = '<i class="fas fa-check" style="color:#8aaeb0;"></i>';
            else if (msg.status === 'delivered') statusHtml = '<i class="fas fa-check-double" style="color:#8aaeb0;"></i>';
            else if (msg.status === 'read') statusHtml = '<i class="fas fa-check-double" style="color:#4a9eff;"></i>';
            if (msg.readCount !== undefined && msg.readCount > 0) readCountHtml = '<span class="read-count">' + msg.readCount + '</span>';
        }
        
        var replyHtml = '';
        if (msg.replyTo) {
            var replyText = (msg.replyTo.text || '').substring(0, 50);
            replyHtml = '<div class="reply-preview">↩️ <strong>' + escapeHtml(msg.replyTo.senderName) + '</strong>: ' + escapeHtml(replyText) +
                (msg.replyTo.msgId ? ' <span class="quote-link" data-msg-id="' + msg.replyTo.msgId + '" data-chat-id="' + (msg.replyTo.chatId || currentChatId) + '">(перейти)</span>' : '') + '</div>';
        }
        
        var reactionsHtml = '';
        if (msg.reactions) {
            var reactionCounts = {};
            for (var uid in msg.reactions) {
                var r = msg.reactions[uid];
                reactionCounts[r] = (reactionCounts[r] || 0) + 1;
            }
            reactionsHtml = '<div class="reactions">';
            for (var rKey in reactionCounts) {
                reactionsHtml += '<span class="reaction" data-msg-id="' + msg._id + '" data-reaction="' + rKey + '">' + rKey + ' ' + reactionCounts[rKey] + '</span>';
            }
            reactionsHtml += '</div>';
        }
        
        var linkPreviewHtml = '';
        if (msg.linkPreview) {
            linkPreviewHtml = '<div class="link-preview">' +
                (msg.linkPreview.image ? '<img src="' + msg.linkPreview.image + '" onerror="this.style.display=\'none\'">' : '') +
                '<div class="title">' + escapeHtml(msg.linkPreview.title || '') + '</div>' +
                (msg.linkPreview.description ? '<div class="desc">' + escapeHtml(msg.linkPreview.description) + '</div>' : '') +
                '<div class="url">' + escapeHtml(msg.linkPreview.url || '') + '</div>' +
            '</div>';
        }
        
        var pollHtml = '';
        if (msg.poll) {
            var poll = msg.poll;
            var totalVotes = 0;
            if (poll.votes) for (var key in poll.votes) totalVotes += poll.votes[key];
            var votedIndex = poll.voters && poll.voters[currentUser?.uid];
            pollHtml = '<div class="poll-container" style="margin-top:8px;background:var(--bg-element);padding:12px;border-radius:16px;border:1px solid var(--border);">' +
                '<div style="font-weight:600;margin-bottom:8px;color:var(--text);">📊 ' + escapeHtml(poll.question) + '</div>';
            for (var oi = 0; oi < poll.options.length; oi++) {
                var opt = poll.options[oi];
                var votes = (poll.votes && poll.votes[oi]) || 0;
                var percent = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
                var isVoted = (votedIndex === oi);
                pollHtml += '<div class="poll-option' + (isVoted ? ' voted' : '') + '" data-msg-id="' + msg._id + '" data-option="' + oi + '">' +
                    '<span>' + escapeHtml(opt) + ' (' + votes + ')' + (isVoted ? ' ✅' : '') + '</span>' +
                    '<span>' + percent + '%</span>' +
                    '<div class="vote-bar" style="width:' + percent + '%;"></div>' +
                '</div>';
            }
            pollHtml += '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">' + totalVotes + ' голосов</div></div>';
        }
        
        var body = '';
        var audioId = 'audio_' + msg._id;
        
        if (msg.audioUrl) {

            longPressTimer = setTimeout(function() {
                isLongPress = true;
                var msgId = msgEl.dataset.msgId;
                var msgData = {
                    text: msgEl.dataset.msgText || '',
                    senderName: msgEl.dataset.msgSender || '',
                    senderId: msgEl.dataset.senderId || '',

function saveStickerToLocal(url, text) {
    if (!currentUser) return;
    if (!userStickers[currentUser.uid]) userStickers[currentUser.uid] = [];
    if (!userStickers[currentUser.uid].some(function(s) { return s.url === url; })) {
        userStickers[currentUser.uid].push({ id: Date.now(), url: url, prompt: text || 'стикер' });
        localStorage.setItem('wolf_stickers', JSON.stringify(userStickers));
        renderStickersPanel();
        toast('⭐ Стикер сохранён');
    } else {
        toast('Уже есть');
    }
}

function deleteSticker(stickerId) {
    if (!currentUser || !userStickers[currentUser.uid]) return;
    userStickers[currentUser.uid] = userStickers[currentUser.uid].filter(function(s) { return s.id !== stickerId; });
    localStorage.setItem('wolf_stickers', JSON.stringify(userStickers));
    renderStickersPanel();
    toast('🗑️ Стикер удалён');
}

async function checkStoryLimit() {
    var today = new Date().toDateString();
    if (storyCountDate !== today) {
        storyCountDate = today;
        todayStoryCount = 0;
        var storiesSnap = await db.ref('stories').once('value');
        var todayStart = new Date(today).getTime();
        storiesSnap.forEach(function(snap) {
            var story = snap.val();
            if (story.userId === currentUser?.uid && story.time >= todayStart) todayStoryCount++;
        });
    }
    return todayStoryCount < 3;
}

function openStoryViewer(userId) {
    var userStories = stories[userId] || [];
    if (!userStories.length) return;
    currentStoryList = userStories;
    currentStoryIndex = 0;
    var user = Object.values(allUsers).find(function(u) { return u.uid === userId; });
    document.getElementById('storyViewerUser').innerText = user ? user.username : 'Пользователь';
    document.getElementById('storyViewerDelete').style.display = (userId === currentUser?.uid) ? 'block' : 'none';
    showCurrentStory();
    document.getElementById('storyViewer').style.display = 'flex';
}

function showCurrentStory() {
    if (storyTimer) clearInterval(storyTimer);
    var story = currentStoryList[currentStoryIndex];
    if (!story) { closeStoryViewer(); return; }
    var imgEl = document.getElementById('storyViewerImg');
    var videoEl = document.getElementById('storyViewerVideo');
    var prevBtn = document.getElementById('storyViewerPrev');
    var skipBtn = document.getElementById('storyViewerSkip');
    prevBtn.style.display = currentStoryIndex > 0 ? 'flex' : 'none';
    skipBtn.style.display = 'flex';
    if (story.type === 'video') {
        imgEl.style.display = 'none';
        videoEl.style.display = 'block';
        videoEl.src = story.mediaUrl;
        videoEl.muted = false;
        videoEl.setAttribute('playsinline', '');
        videoEl.play().catch(function() { videoEl.muted = true; videoEl.play().catch(function(){}); });
        videoEl.onended = function() { nextStory(); };
        var fill = document.querySelector('.story-viewer-progress-fill');
        fill.style.width = '0%';
        storyTimer = setInterval(function() {
            if (!videoEl.duration || isNaN(videoEl.duration)) return;
            var percent = (videoEl.currentTime / videoEl.duration) * 100;
            fill.style.width = Math.min(percent, 100) + '%';
            if (videoEl.ended || videoEl.currentTime >= videoEl.duration - 0.1) clearInterval(storyTimer);
        }, 100);
    } else {
        videoEl.style.display = 'none';
        videoEl.pause(); videoEl.src = '';
        imgEl.style.display = 'block';
        imgEl.src = story.mediaUrl;
        var fill2 = document.querySelector('.story-viewer-progress-fill');
        fill2.style.width = '0%';
        var startTime = Date.now();
        storyTimer = setInterval(function() {
            var elapsed = Date.now() - startTime;
            var percent = (elapsed / 5000) * 100;
            fill2.style.width = Math.min(percent, 100) + '%';
            if (elapsed >= 5000) { clearInterval(storyTimer); nextStory(); }
        }, 50);
    }
}

function nextStory() { currentStoryIndex++; if (currentStoryIndex < currentStoryList.length) showCurrentStory(); else closeStoryViewer(); }
function prevStory() { if (currentStoryIndex > 0) { currentStoryIndex--; showCurrentStory(); } }

async function deleteCurrentStory() {
    var story = currentStoryList[currentStoryIndex];
    if (!story || story.userId !== currentUser?.uid) {
        toast('❌ Вы не можете удалить эту сторис');
        return;
    }
    if (!confirm('Удалить эту историю?')) return;
    try {
        await db.ref('stories/' + story.id).remove();
        toast('🗑️ История удалена');
        currentStoryList.splice(currentStoryIndex, 1);
        if (currentStoryList.length === 0) { 
            closeStoryViewer(); 
            loadStories(); 
        } else { 
            if (currentStoryIndex >= currentStoryList.length) {
                currentStoryIndex = currentStoryList.length - 1; 
            }
            showCurrentStory(); 
            loadStories(); 
        }
    } catch(e) {
        console.error('Ошибка удаления сторис:', e);
        toast('❌ Ошибка удаления сторис: ' + (e.message || 'неизвестная ошибка'));
    }
}

function closeStoryViewer() {
    if (storyTimer) clearInterval(storyTimer);
    var videoEl = document.getElementById('storyViewerVideo');
    if (videoEl) { videoEl.pause(); videoEl.src = ''; }
    document.getElementById('storyViewer').style.display = 'none';
    currentStoryList = [];
}

var touchStartX = 0;
document.getElementById('storyViewerContent').addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; });
document.getElementById('storyViewerContent').addEventListener('touchend', function(e) {
    var touchEndX = e.changedTouches[0].clientX;
    var diff = touchStartX - touchEndX;
    if (Math.abs(diff) > 50) { if (diff > 0) nextStory(); else prevStory(); }
});

async function createOrOpenChat(targetNick) {
    if (!targetNick || targetNick === currentUser.username) return toast('Нельзя открыть чат с самим собой');
    var target = allUsers[targetNick];
    if (!target) return toast('Пользователь ' + targetNick + ' не найден');
    if (blockedUsers.includes(target.uid)) return toast('Пользователь заблокирован');
    var snap = await db.ref('chats').once('value');
    var chatId = null;
    snap.forEach(function(child) {
        var c = child.val();
        if (c.type !== 'group' && c.participants && c.participants[currentUser.uid] && c.participants[target.uid]) {
            chatId = child.key;
        }
    });
    if (!chatId) {
        var newChat = db.ref('chats').push();
        await newChat.set({
            participants: { [currentUser.uid]: true, [target.uid]: true },
            type: 'private',
            createdAt: Date.now()
        });
        chatId = newChat.key;
    }
    updateChattedUsersCache().then(function() { loadStories(); });
    openChat(chatId);
}

async function createGroup(name, memberIds) {
    var participants = { [currentUser.uid]: true };
    memberIds.forEach(function(uid) { participants[uid] = true; });
    var newChat = db.ref('chats').push();
    await newChat.set({
        participants: participants,
        type: 'group',
        groupName: name,
        createdAt: Date.now(),
        createdBy: currentUser.uid
    });
    await db.ref('messages/' + newChat.key).push({
        text: '🤵 ' + currentUser.username + ' создал(а) группу "' + name + '"',
        senderId: 'system',
        senderName: 'System',
        time: Date.now(),
        isSystem: true
    });
    updateChattedUsersCache().then(function() { loadStories(); });
    openChat(newChat.key);
}

function updateGroupOnlineStatuses(chatId) {
    if (currentChatId !== chatId) return;
    db.ref('chats/' + chatId).once('value', async function(snap) {
        var chat = snap.val();
        if (!chat || chat.type !== 'group') return;
        var participants = Object.keys(chat.participants);
        var onlineCount = 0;
        for (var i = 0; i < participants.length; i++) {
            var uid = participants[i];
            if (uid !== currentUser.uid && uid !== AI_ID) {
                var online = await new Promise(function(resolve) {
                    getUserOnline(uid, resolve);
                });
                if (online) onlineCount++;
            }
        }
        document.getElementById('chatStatus').innerHTML = onlineCount > 0
            ? '👥 ' + participants.length + ' участников • ' + onlineCount + ' в сети'
            : '👥 ' + participants.length + ' участников';
    });
}

function performSearch() {
    var query = document.getElementById('searchUser').value.trim();
    var resDiv = document.getElementById('searchResults');
    if (!query || !currentUser || Object.keys(allUsers).length === 0) {
        if (resDiv) resDiv.style.display = 'none';
        return;
    }
    var q = normalize(query);
    var results = [];
    for (var name in allUsers) {
        if (name !== currentUser.username && normalize(name).includes(q)) results.push(name);
    }
    if (results.length === 0) { if (resDiv) resDiv.style.display = 'none'; return; }
    if (resDiv) {
        resDiv.style.display = 'block';
        resDiv.innerHTML = results.slice(0, 5).map(function(nick) {
            return '<div class="search-item" data-nick="' + escapeHtml(nick) + '">' + escapeHtml(nick) + '</div>';
        }).join('');
        document.querySelectorAll('.search-item').forEach(function(el) {
            el.onclick = function() {
                document.getElementById('searchUser').value = '';
                if (resDiv) resDiv.style.display = 'none';
                createOrOpenChat(el.dataset.nick);
            };
        });
    }
}

async function calculateUnreadCounts() {
    if (!currentUser) return;
    var chatsSnap = await db.ref('chats').once('value');
    var chatIds = [];
    chatsSnap.forEach(function(child) {
        var chat = child.val();
        if (child.key !== SAVED_CHAT_ID && child.key !== AI_ID &&
            chat.participants && chat.participants[currentUser.uid]) {
            chatIds.push(child.key);
        }
    });
    var newUnreadCounts = {};
    var promises = chatIds.map(function(chatId) {
        return db.ref('messages/' + chatId).once('value').then(function(msgsSnap) {
            var unread = 0;
            msgsSnap.forEach(function(msgChild) {
                var msg = msgChild.val();
                if (msg.senderId !== currentUser.uid &&
                    msg.senderId !== AI_ID &&
                    msg.status !== 'read') {
                    unread++;
                }
            });
            newUnreadCounts[chatId] = unread;
        });
    });
    await Promise.all(promises);
    unreadCounts = newUnreadCounts;
    updateTotalUnreadBadge();
}

function updateTotalUnreadBadge() {
    totalUnread = 0;
    for (var chatId in unreadCounts) totalUnread += unreadCounts[chatId] || 0;
    var backBadge = document.getElementById('backBtnBadge');
    if (backBadge) {
        if (totalUnread > 0) {
            backBadge.style.display = 'flex';
            backBadge.innerText = totalUnread > 99 ? '99+' : totalUnread;
        } else {
            backBadge.style.display = 'none';
        }
    }
}

function loadChats() {
    if (!currentUser) return;
    cleanupTypingListeners();
    cleanupOnlineListeners();
    if (chatsListener && typeof chatsListener.off === 'function') chatsListener.off();
    chatsListener = db.ref('chats').on('value', async function(snap) {
        if (!currentUser) return;
        var chats = [];
        chats.push({ id: SAVED_CHAT_ID, name: t('saved'), lastMsg: savedMessages.length + ' сообщений', time: Date.now(), isSpecial: true });
        snap.forEach(function(child) {
            var c = child.val();
            if (c.participants && c.participants[currentUser.uid]) {
                if (c.archived === true) return;
                if (c.type === 'group') {
                    chats.push({ id: child.key, name: c.groupName || 'Группа', lastMsg: c.lastMessage?.text || 'Новый чат', time: c.lastMessage?.time || c.createdAt || 0, isGroup: true, avatar: c.avatar, participants: c.participants, pinned: c.pinned || false });
                } else {
                    var otherUid = Object.keys(c.participants).find(function(uid) { return uid !== currentUser.uid; });
                    if (otherUid) chats.push({ id: child.key, name: otherUid === AI_ID ? AI_NAME : '...', lastMsg: c.lastMessage?.text || 'Новый чат', time: c.lastMessage?.time || c.createdAt || 0, otherUid: otherUid, participants: c.participants, pinned: c.pinned || false });
                }
            }
        });
        var namePromises = chats.map(async function(chat) {
            if (chat.otherUid && chat.otherUid !== AI_ID && chat.name === '...') {
                var userSnap = await db.ref('users/' + chat.otherUid).once('value');
                var userData = userSnap.val();
                chat.name = userData?.username || 'Пользователь';
                chat.userData = userData;
            }
            return chat;
        });
        var resolvedChats = await Promise.all(namePromises);
        resolvedChats.sort(function(a, b) {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            return (b.time || 0) - (a.time || 0);
        });

        var limitedChats = resolvedChats.slice(0, 30);
        if (resolvedChats.length > 30) {
            limitedChats.push({ id: 'show_all', name: '📂 Показать все чаты (' + resolvedChats.length + ')', isSpecial: true, lastMsg: '', time: Date.now() });
        }
        renderChatsList(limitedChats);
        calculateUnreadCounts();
    });
}

        } else if (avatarOwnerUid === currentUser.uid) {

            '<div class="chat-avatar ' + avatarShapeClass + '" id="avatar_' + chat.id + '">' + avatarHtml + '</div>' +
            '<div class="chat-details"><div class="chat-name" id="name_' + chat.id + '">' + displayName + ' ' + pinIcon + badgeHtml + '</div>' +
            '<div class="last-msg">' + (isBannedUser ? '🚫 Забанен: ' + escapeHtml(banReason) : escapeHtml((chat.lastMsg || '').substring(0, 50))) + '</div></div>' +

function loadChatsFull() {
    if (chatsListener && typeof chatsListener.off === 'function') chatsListener.off();
    chatsListener = db.ref('chats').on('value', async function(snap) {
        if (!currentUser) return;
        var chats = [];
        chats.push({ id: SAVED_CHAT_ID, name: t('saved'), lastMsg: savedMessages.length + ' сообщений', time: Date.now(), isSpecial: true });
        snap.forEach(function(child) {
            var c = child.val();
            if (c.participants && c.participants[currentUser.uid]) {
                if (c.archived === true) return;
                if (c.type === 'group') {
                    chats.push({ id: child.key, name: c.groupName || 'Группа', lastMsg: c.lastMessage?.text || 'Новый чат', time: c.lastMessage?.time || c.createdAt || 0, isGroup: true, avatar: c.avatar, participants: c.participants, pinned: c.pinned || false });
                } else {
                    var otherUid = Object.keys(c.participants).find(function(uid) { return uid !== currentUser.uid; });
                    if (otherUid) chats.push({ id: child.key, name: otherUid === AI_ID ? AI_NAME : '...', lastMsg: c.lastMessage?.text || 'Новый чат', time: c.lastMessage?.time || c.createdAt || 0, otherUid: otherUid, participants: c.participants, pinned: c.pinned || false });
                }
            }
        });
        var namePromises = chats.map(async function(chat) {
            if (chat.otherUid && chat.otherUid !== AI_ID && chat.name === '...') {
                var userSnap = await db.ref('users/' + chat.otherUid).once('value');
                var userData = userSnap.val();
                chat.name = userData?.username || 'Пользователь';
                chat.userData = userData;
            }
            return chat;
        });
        var resolvedChats = await Promise.all(namePromises);
        resolvedChats.sort(function(a, b) {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            return (b.time || 0) - (a.time || 0);
        });
        renderChatsList(resolvedChats);
        calculateUnreadCounts();
    });
}

async function updateChatStatus(otherUid) {
    if (!otherUid || otherUid === AI_ID || otherUid === SAVED_CHAT_ID) {
        document.getElementById('chatStatus').innerHTML = '';
        return;
    }
    if (statusListenerRef && statusListenerCallback && typeof statusListenerRef.off === 'function') {
        statusListenerRef.off('value', statusListenerCallback);
    }
    var typingRef = db.ref('/typing/' + currentChatId + '/' + otherUid);
    statusListenerCallback = function(snap) {
        if (snap.val()) {
            document.getElementById('chatStatus').innerHTML = '<span class="typing-indicator">✏️ печатает...</span>';
        } else {
            getUserOnline(otherUid, async function(online) {
                if (online) {
                    document.getElementById('chatStatus').innerHTML = '<span style="color:#2ecc71;">● В сети</span>';
                } else {
                    var lastSeenSnap = await db.ref('/status/' + otherUid).once('value');
                    var lastSeen = null;
                    if (lastSeenSnap.val()) {
                        for (var deviceId in lastSeenSnap.val()) {
                            if (lastSeenSnap.val()[deviceId].lastSeen) {
                                var ts = lastSeenSnap.val()[deviceId].lastSeen;
                                if (!lastSeen || ts > lastSeen) lastSeen = ts;
                            }
                        }
                    }
                    document.getElementById('chatStatus').innerHTML = 'был(а) ' + formatLastSeen(lastSeen);
                }
            });
        }
    };
    typingRef.on('value', statusListenerCallback);
    statusListenerRef = typingRef;
}

function openChat(chatId) {
    if (chatId === SAVED_CHAT_ID) { openSavedChat(); return; }
    cleanupCurrentChat();
    document.getElementById('messagesArea').innerHTML = '';
    currentChatId = chatId;
    window._otherUid = null;
    document.getElementById('callBtn').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';
    var msgInput = document.getElementById('messageInput');
    if (msgInput) {
        msgInput.removeEventListener('input', handleTypingEvent);
        msgInput.addEventListener('input', handleTypingEvent);
    }
    markMessagesAsRead(chatId);
    db.ref('chats/' + chatId).once('value', async function(snap) {
        var chat = snap.val();
        if (!chat) return;
        var displayName = '';
        var otherUid = chat.type !== 'group' ? Object.keys(chat.participants || {}).find(function(uid) { return uid !== currentUser?.uid; }) : null;
        window._otherUid = otherUid;
        
        var isOtherBanned = false;
        var banReason = '';
        var isOtherMuted = false;
        var muteReason = '';
        var muteRemaining = 0;
        
        if (otherUid) {
            var banCheck = await isBanned(otherUid);
            isOtherBanned = banCheck.banned;
            banReason = banCheck.reason || '';
            
            var muteCheck = await isMuted(otherUid);
            isOtherMuted = muteCheck.muted;
            muteReason = muteCheck.reason || '';
            if (isOtherMuted && muteCheck.until) {
                muteRemaining = Math.round((muteCheck.until - Date.now()) / 60000);
            }
        }
        
        if (chat.type === 'group') displayName = chat.groupName || 'Группа';
        else if (otherUid === AI_ID) displayName = AI_NAME;
        else if (otherUid) {
            var userSnap = await db.ref('users/' + otherUid).once('value');
            displayName = userSnap.val()?.username || 'Собеседник';
            if (isOtherBanned) {
                displayName += ' 🚫 (забанен)';
            } else if (isOtherMuted) {
                displayName += ' 🔇 (замучен)';
            }
        }
        var chatNameEl = document.getElementById('chatName');
        chatNameEl.innerHTML = displayName;
        
        if (otherUid && otherUid !== AI_ID) {
            applyBadgeToName(otherUid, chatNameEl);
        } else if (otherUid === currentUser.uid) {
            applyBadgeToName(currentUser.uid, chatNameEl);
        }
        
        var avatarDiv = document.getElementById('chatAvatar');
        if (chat.type === 'group') avatarDiv.innerHTML = chat.avatar ? '<img src="' + chat.avatar + '" style="width:100%;height:100%;object-fit:cover;">' : '<i class="fas fa-users"></i>';
        else if (otherUid && otherUid !== AI_ID) {
            if (isOtherBanned) {
                avatarDiv.innerHTML = '🚫';
            } else {
                var avSnap = await db.ref('users/' + otherUid + '/avatar').once('value');
                avatarDiv.innerHTML = avSnap.val() ? '<img src="' + avSnap.val() + '" style="width:100%;height:100%;object-fit:cover;">' : '?';
            }
        } else avatarDiv.innerHTML = otherUid === AI_ID ? '🤖' : '?';
        
        if (otherUid && otherUid !== currentUser.uid && otherUid !== AI_ID) {
            applyAvatarShapeForUser(otherUid, avatarDiv);
            applyBorderToElement(otherUid, avatarDiv);
        } else if (otherUid === currentUser.uid) {
            var myShape = localStorage.getItem('avatarShape_' + currentUser.uid) || 'circle';
            avatarDiv.className = avatarDiv.className.split(' ').filter(function(c) { return !c.startsWith('avatar-shape-'); }).join(' ');
            avatarDiv.classList.add('avatar-shape-' + myShape);
            applyBorderToElement(currentUser.uid, avatarDiv);
        } else {
            avatarDiv.className = 'chat-avatar-header';
        }
        
        if (isOtherBanned) {
            document.getElementById('chatStatus').innerHTML = '🚫 Забанен: ' + escapeHtml(banReason);
            document.getElementById('messageInput').disabled = true;
            document.getElementById('messageInput').placeholder = '🚫 Собеседник забанен';
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('sendBtn').style.opacity = '0.5';
        } else if (isOtherMuted) {
            document.getElementById('chatStatus').innerHTML = '🔇 Замучен на ' + muteRemaining + ' мин. Причина: ' + escapeHtml(muteReason);
            document.getElementById('messageInput').disabled = false;
            document.getElementById('messageInput').placeholder = 'Сообщение... (собеседник замучен)';
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('sendBtn').style.opacity = '1';
        } else if (chat.type !== 'group' && otherUid !== AI_ID && otherUid) {
            updateChatStatus(otherUid);
            document.getElementById('messageInput').disabled = false;
            document.getElementById('messageInput').placeholder = 'Сообщение...';
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('sendBtn').style.opacity = '1';
        } else if (otherUid === AI_ID) {
            document.getElementById('chatStatus').innerHTML = '🤖 ИИ ассистент';
            document.getElementById('messageInput').disabled = false;
            document.getElementById('messageInput').placeholder = 'Сообщение...';
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('sendBtn').style.opacity = '1';
        } else if (chat.type === 'group') {
            updateGroupOnlineStatuses(chatId);
            document.getElementById('messageInput').disabled = false;
            document.getElementById('messageInput').placeholder = 'Сообщение...';
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('sendBtn').style.opacity = '1';
        }
    });
    
    messagesListener = db.ref('messages/' + chatId).orderByChild('time').on('value', function(snap) {
        var msgs = [];
        snap.forEach(function(child) {
            var m = child.val();
            m._id = child.key;
            msgs.push(m);
            if (m.senderId !== currentUser?.uid && m.senderId !== AI_ID && m.status !== 'read') markMessageAsRead(child.key, chatId);
        });
        renderMessages(msgs);
    });
}

async function uploadMusic(file) {
    if (!currentUser) return toast('❌ Не авторизован');
    if (!file) return;
    
    if (file.size > 20 * 1024 * 1024) {
        toast('⚠️ Файл должен быть до 20 МБ');
        return;
    }
    
    var allowedTypes = ['audio/mpeg', 'audio/mp3', 'audio/aac', 'audio/ogg', 'audio/wav', 'audio/flac'];
    if (!allowedTypes.includes(file.type) && !file.name.match(/\.(mp3|aac|ogg|wav|flac)$/i)) {
        toast('⚠️ Поддерживаются: MP3, AAC, OGG, WAV, FLAC');
        return;
    }
    
    try {
        toast('⏳ Загрузка музыки...');
        var reader = new FileReader();
        var musicData = await new Promise(function(resolve, reject) {
            reader.onload = function(e) { resolve(e.target.result); };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
        
        var fileName = file.name.replace(/\.[^/.]+$/, '');
        
        await db.ref('users/' + currentUser.uid + '/music').set({
            data: musicData,
            name: fileName,
            uploadedAt: Date.now(),
            size: file.size,
            type: file.type
        });
        
        toast('✅ Музыка загружена!');
        updateDrawerMusic();
        updateAvatarUI();
    } catch(e) {
        console.error('Ошибка загрузки музыки:', e);
        toast('❌ Ошибка загрузки музыки: ' + e.message);
    }
}

var globalAudio = null;
var globalMusicUid = null;
var isGlobalMusicPlaying = false;

function toggleMusicPlayback(uid) {
    if (!uid) return;
    
    if (globalMusicUid === uid && globalAudio && isGlobalMusicPlaying) {
        globalAudio.pause();
        isGlobalMusicPlaying = false;
        updateMusicPlayButton(false);
        return;
    }
    
    db.ref('users/' + uid + '/music').once('value').then(function(snap) {
        var music = snap.val();
        if (!music || !music.data) {
            toast('🎵 У этого пользователя нет музыки');
            return;
        }
        
        if (globalAudio) {
            globalAudio.pause();
            globalAudio = null;
        }
        
        try {
            globalAudio = new Audio(music.data);
            globalMusicUid = uid;
            
            globalAudio.onloadeddata = function() {
                globalAudio.play().catch(function(e) {
                    console.warn('Play error:', e);
                    toast('⚠️ Ошибка воспроизведения');
                });
                isGlobalMusicPlaying = true;
                updateMusicPlayButton(true);
            };
            
            globalAudio.onended = function() {
                isGlobalMusicPlaying = false;
                updateMusicPlayButton(false);
            };
            
            globalAudio.onerror = function() {
                toast('⚠️ Ошибка воспроизведения');
                isGlobalMusicPlaying = false;
                updateMusicPlayButton(false);
            };
            
            if (globalAudio.readyState >= 2) {
                globalAudio.play().catch(function(e) {
                    console.warn('Play error:', e);
                });
                isGlobalMusicPlaying = true;
                updateMusicPlayButton(true);
            }
            
        } catch(e) {
            console.error('Audio error:', e);
            toast('❌ Ошибка воспроизведения');
        }
    });
}

function updateMusicPlayButton(isPlaying) {
    var miniBtn = document.getElementById('miniPlayBtn');
    if (miniBtn) {
        miniBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';

    document.querySelectorAll('.music-play-btn-inline').forEach(function(btn) {
        btn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';

function showArchivedChats() {
    var modal = document.getElementById('modal');
    var inner = document.getElementById('modalInner');
    db.ref('chats').orderByChild('participants/' + currentUser.uid).equalTo(true).once('value', function(snap) {
        var archived = [];
        snap.forEach(function(child) {
            var c = child.val();
            if (c.archived === true) archived.push({ id: child.key, name: c.type === 'group' ? (c.groupName || 'Группа') : '...', c: c });
        });
        Promise.all(archived.map(async function(chat) {
            if (!chat.c.type === 'group') {
                var other = Object.keys(chat.c.participants).find(u => u !== currentUser.uid);
                if (other && other !== AI_ID) {
                    var uSnap = await db.ref('users/' + other + '/username').once('value');
                    chat.name = uSnap.val() || 'Пользователь';
                }
            }
            return chat;
        })).then(function(resolved) {
            inner.innerHTML = '<h3>📦 Архив (' + resolved.length + ')</h3>' +

async function forwardMessage(msgData, targetChatId) {

        senderName: currentUser.username,
        time: Date.now(),
        status: 'sent',
        isForwarded: true,
        originalSender: msgData.senderName,
        originalTime: msgData.time
    };
    if (msgData.imageUrl) msg.imageUrl = msgData.imageUrl;
    if (msgData.audioUrl) msg.audioUrl = msgData.audioUrl;
    if (msgData.videoUrl) msg.videoUrl = msgData.videoUrl;
    await db.ref('messages/' + targetChatId).push(msg);
    await db.ref('chats/' + targetChatId).update({ lastMessage: { text: '📤 Пересланное сообщение', time: Date.now() } });

async function fetchLinkPreview(url) {
    try {
        var corsProxy = 'https://api.allorigins.win/raw?url=';
        var resp = await fetch(corsProxy + encodeURIComponent(url));
        var html = await resp.text();
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');
        var title = doc.querySelector('meta[property="og:title"]')?.content || doc.querySelector('title')?.innerText || 'Ссылка';
        var desc = doc.querySelector('meta[property="og:description"]')?.content || '';
        var img = doc.querySelector('meta[property="og:image"]')?.content || '';
        return { title: title, description: desc, image: img, url: url };
    } catch(e) {
        return null;
    }
}

        if (options.length < 2) { toast('Минимум 2 варианта'); return; }

        await db.ref('messages/' + currentChatId).push({

async function votePoll(msgId, optionIndex) {
    if (!currentChatId) return;
    var pollRef = db.ref('messages/' + currentChatId + '/' + msgId + '/poll');
    var snap = await pollRef.once('value');
    var poll = snap.val();
    if (!poll) return;
    
    var voters = poll.voters || {};
    var currentVote = voters[currentUser.uid];
    
    if (currentVote === optionIndex) {
        var votes = poll.votes || {};
        votes[optionIndex] = Math.max(0, (votes[optionIndex] || 0) - 1);
        delete voters[currentUser.uid];
        await pollRef.update({ votes: votes, voters: voters });
        toast('❌ Голос отменён');
        renderMessages(await getMessages(currentChatId));
        return;
    }
    
    var votes = poll.votes || {};
    if (currentVote !== undefined && currentVote !== null) {
        votes[currentVote] = Math.max(0, (votes[currentVote] || 0) - 1);
    }
    
    votes[optionIndex] = (votes[optionIndex] || 0) + 1;
    voters[currentUser.uid] = optionIndex;
    await pollRef.update({ votes: votes, voters: voters });
    toast('✅ Голос учтён');
    renderMessages(await getMessages(currentChatId));
}

async function getMessages(chatId) {
    if (!chatId) return [];
    var snap = await db.ref('messages/' + chatId).once('value');
    var msgs = [];
    snap.forEach(function(child) {
        var m = child.val();
        m._id = child.key;
        msgs.push(m);
    });
    return msgs;
}

var contextMenu = document.getElementById('contextMenu');

function showContextMenu(x, y, msgId, msgData, chatId) {
    contextMenu.style.display = 'block';
    contextMenu.style.left = Math.min(x, window.innerWidth - 220) + 'px';
    contextMenu.style.top = Math.min(y, window.innerHeight - 300) + 'px';
    contextMsgId = msgId;
    contextMsgData = msgData;
    contextChatId = chatId || currentChatId;
    var items = contextMenu.querySelectorAll('.context-menu-item');
    items.forEach(function(item) {
        var action = item.dataset.action;
        if (action === 'edit' || action === 'delete') {
            item.style.display = (msgData.senderId === currentUser?.uid) ? 'flex' : 'none';
        } else {
            item.style.display = 'flex';
        }
    });
}

function hideContextMenu() {
    contextMenu.style.display = 'none';
    contextMsgId = null;
    contextMsgData = null;
    contextChatId = null;
}

document.addEventListener('click', function(e) {
    if (contextMenu.style.display === 'block' && !contextMenu.contains(e.target)) {
        hideContextMenu();
    }
});

contextMenu.querySelectorAll('.context-menu-item').forEach(function(item) {
    item.onclick = async function(e) {
        e.stopPropagation();
        var action = this.dataset.action;
        if (!contextMsgId || !contextMsgData) { hideContextMenu(); return; }
        switch(action) {
            case 'reply':
                replyToMsg = {
                    msgId: contextMsgId,
                    text: contextMsgData.text || '',
                    senderName: contextMsgData.senderName || ''
                };
                document.getElementById('replyText').innerHTML = escapeHtml(replyToMsg.senderName) + ': ' + escapeHtml((replyToMsg.text || '').substring(0, 50));
                document.getElementById('replyBar').style.display = 'flex';
                break;
            case 'forward':
                showForwardDialog(contextMsgData);
                break;
            case 'copy':
                navigator.clipboard.writeText(contextMsgData.text || '');
                toast('📋 Скопировано');
                break;
            case 'edit':
                var newText = prompt('Редактировать:', contextMsgData.text || '');
                if (newText && newText !== (contextMsgData.text || '')) {
                    await db.ref('messages/' + contextChatId + '/' + contextMsgId).update({ text: newText.trim(), edited: true });
                }
                break;
            case 'delete':
                if (confirm('Удалить сообщение?')) {
                    await db.ref('messages/' + contextChatId + '/' + contextMsgId).remove();
                }
                break;
            default: break;
        }
        hideContextMenu();
    };
});

let touchStartMsg = null;
let touchStartXPos = 0;

document.getElementById('messagesArea').addEventListener('touchstart', function(e) {
    const msg = e.target.closest('.message');
    if (msg) {
        touchStartXPos = e.touches[0].clientX;
        touchStartMsg = msg;
    }
}, { passive: true });

document.getElementById('messagesArea').addEventListener('touchend', function(e) {
    if (!touchStartMsg) return;
    const diff = e.changedTouches[0].clientX - touchStartXPos;
    if (diff > 60) {
        const msgId = touchStartMsg.dataset.msgId;

async function handleLogin(user, pass) {
    try {
        var cred = await auth.signInWithEmailAndPassword(usernameToEmail(user), pass);
        var snap = await db.ref('users/' + cred.user.uid).once('value');
        currentUser = { uid: cred.user.uid, username: snap.val()?.username || user };
        startApp();
    } catch(e) { document.getElementById('loginError').innerText = 'Неверный ник или пароль'; }
}

async function handleRegister(user, pass) {
    if (!/^[a-zA-Z0-9._]{3,32}$/.test(user)) { document.getElementById('regError').innerText = 'Ник: 3-32 латиница'; return; }
    if (pass.length < 3) { document.getElementById('regError').innerText = 'Пароль ≥3'; return; }
    try {
        var cred = await auth.createUserWithEmailAndPassword(usernameToEmail(user), pass);
        await db.ref('users/' + cred.user.uid).set({ username: user, uid: cred.user.uid, createdAt: Date.now() });
        currentUser = { uid: cred.user.uid, username: user };
        startApp();
    } catch(e) { document.getElementById('regError').innerText = e.message; }
}

async function handleGuest() {
    try {
        var cred = await auth.signInAnonymously();
        var guestName = 'guest_' + Math.random().toString(36).substr(2, 6);
        await db.ref('users/' + cred.user.uid).set({ username: guestName, uid: cred.user.uid, isGuest: true });
        currentUser = { uid: cred.user.uid, username: guestName };
        startApp();
    } catch(e) { toast('Ошибка входа'); }
}

auth.onAuthStateChanged(async function(user) {
    if (user && !currentUser) {
        var snap = await db.ref('users/' + user.uid).once('value');
        var userData = snap.val();
        
        if (userData && userData.banned && userData.banned.banned === true) {
            var banReason = userData.banned.reason || 'Забанен администратором';
            var bannedBy = userData.banned.bannedByUsername || 'Администратор';
            
            const splash = document.getElementById('splashScreen');
            const splashContent = splash.querySelector('.splash-title');
            if (splashContent) {
                splashContent.innerHTML = '🚫 Вы забанены!';
            }
            const splashSub = splash.querySelector('.splash-sub');
            if (splashSub) {
                splashSub.innerHTML = 'Причина: ' + banReason + '<br>Забанил: ' + bannedBy;
                splashSub.style.color = '#ff6b6b';
            }
            
            await new Promise(resolve => setTimeout(resolve, 2500));
            
            splash.classList.add('hidden');
            await new Promise(resolve => setTimeout(resolve, 400));
            splash.style.display = 'none';
            
            document.getElementById('authPage').style.display = 'flex';
            document.getElementById('authPage').classList.add('splash-ready');
            document.getElementById('mainApp').style.display = 'none';
            
            var errorEl = document.getElementById('loginError');
            if (errorEl) errorEl.innerText = '🚫 Вы забанены! Причина: ' + banReason;
            
            if (typeof eruda !== 'undefined' && eruda._isInit) {
                try {
                    eruda.destroy();
                } catch(e) {}
            }
            
            try { await auth.signOut(); } catch(e) {}
            currentUser = null;
            return;
        }
        
        currentUser = { uid: user.uid, username: userData?.username || 'User' };
        await startApp();
        
    } else if (!user) {
        const splash = document.getElementById('splashScreen');
        const authPage = document.getElementById('authPage');
        const mainApp = document.getElementById('mainApp');
        
        authPage.classList.remove('splash-ready');
        mainApp.classList.remove('splash-ready');
        mainApp.style.display = 'none';
        authPage.style.display = 'none';
        
        splash.style.display = 'flex';
        splash.classList.remove('hidden');
        
        await new Promise(resolve => setTimeout(resolve, 2500));
        
        splash.classList.add('hidden');
        await new Promise(resolve => setTimeout(resolve, 400));
        splash.style.display = 'none';
        
        authPage.style.display = 'flex';
        authPage.classList.add('splash-ready');
        
        var banMsg = document.querySelector('.ban-message');
        if (banMsg) banMsg.remove();
        
        if (typeof eruda !== 'undefined' && eruda._isInit) {
            try {
                eruda.destroy();
            } catch(e) {}
        }
    }
});

async function startApp() {
    const splash = document.getElementById('splashScreen');
    const authPage = document.getElementById('authPage');
    const mainApp = document.getElementById('mainApp');
    
    authPage.classList.remove('splash-ready');
    mainApp.classList.remove('splash-ready');
    authPage.style.display = 'none';
    mainApp.style.display = 'none';
    
    splash.style.display = 'flex';
    splash.classList.remove('hidden');
    
    await new Promise(resolve => setTimeout(resolve, 2500));
    
    splash.classList.add('hidden');
    await new Promise(resolve => setTimeout(resolve, 400));
    splash.style.display = 'none';
    
    if (currentUser) {
        document.getElementById('myUsername').innerText = currentUser.username;
        await updateChattedUsersCache();
        updateAvatarUI();
        setUserOnline(currentUser.uid);
        loadAllUsers();
        loadOfficialStickers();
        renderStickersPanel();
        setupStickerTabs();

        listenAnnouncements();
        
        applyMyAvatarShapeLocally();

                    applyBorderToElement(currentUser.uid, myAvatar);
                }
                var drawerAvatar = document.getElementById('drawerAvatar');

                }
                var myUsername = document.getElementById('myUsername');
                if (myUsername) {
                    applyBadgeToName(currentUser.uid, myUsername);
                }
                var drawerUsername = document.getElementById('drawerUsername');
                if (drawerUsername) {
                    applyBadgeToName(currentUser.uid, drawerUsername);
                }

        }, 500);
        
        mainApp.style.display = 'flex';
        mainApp.classList.add('splash-ready');
        
        setTimeout(function() {
            loadStories();
            updateDrawerMusic();
        }, 300);
        
        setTimeout(setupAdminButton, 300);
        setTimeout(initErudaForAdmins, 800);
        
        db.ref('chats').orderByChild('participants/' + currentUser.uid).equalTo(true).once('value', async function(snap) {
            var hasAI = false;
            snap.forEach(function(child) { 
                if (child.val().participants && child.val().participants[AI_ID]) hasAI = true; 
            });

            } catch(e) {}
        }
    }
}

async function logout() {
    cleanupCurrentChat();
    cleanupTypingListeners();
    cleanupOnlineListeners();
    if (chatsListener && typeof chatsListener.off === 'function') chatsListener.off();
    if (usersListener && typeof usersListener.off === 'function') usersListener.off();
    if (callsListener && typeof callsListener.off === 'function') callsListener.off();
    stopRingtone();
    stopDialTone();
    releaseWakeLock();
    if (peerConnection) await endCall(false);
    aiConversationHistory = {};
    
    if (globalAudio) {
        globalAudio.pause();
        globalAudio = null;
        globalMusicUid = null;
        isGlobalMusicPlaying = false;
        updateMusicPlayButton(false);
    }
    
    if (typeof eruda !== 'undefined' && eruda._isInit) {
        try {
            eruda.destroy();
            console.log('🛠️ Eruda удалена при выходе');
        } catch(e) {
            console.warn('⚠️ Ошибка удаления Eruda:', e);
        }
    }
    
    try { await auth.signOut(); } catch(e) {}
    
    currentUser = null; 
    currentChatId = null; 
    allUsers = {};
    chattedUsersCache.clear();
    unreadCounts = {};
    
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'none';

    splash.classList.add('hidden');

    splash.style.display = 'none';
    
    const authPage = document.getElementById('authPage');
    authPage.style.display = 'flex';
    authPage.classList.add('splash-ready');
    
    var banMsg = document.querySelector('.ban-message');
    if (banMsg) banMsg.remove();
    
    document.getElementById('loginPass').value = '';
    document.getElementById('loginError').innerText = '';

}
